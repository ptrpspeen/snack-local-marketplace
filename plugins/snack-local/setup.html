<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>เชื่อม Expo — Snack Local</title><style>body{font:18px system-ui;max-width:600px;margin:60px auto;padding:24px}input,button{font:inherit;padding:12px;width:100%;box-sizing:border-box;margin:12px 0}</style>
<h1>เชื่อมบัญชี Expo</h1><p>สร้าง access token ใน <a href="https://expo.dev/settings/access-tokens" target="_blank" rel="noopener noreferrer">Expo Settings</a> แล้วกรอกที่นี่ครั้งเดียว</p><p>Token เก็บในไฟล์เฉพาะผู้ใช้บนเครื่องนี้ ไม่ส่งผ่านแชต ใช้สำหรับบันทึกตรงไป Expo เท่านั้น รุ่นนี้เก็บเป็นไฟล์ข้อความในโฟลเดอร์ผู้ใช้ ไม่ใช่ระบบจัดเก็บรหัสผ่านของ OS</p>
<form><label for="token">Expo access token</label><input id="token" type="password" autocomplete="off" required><button>บันทึกการเชื่อมต่อในเครื่อง</button></form><p id="result"></p><a href="./">กลับไป preview</a>
<script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('token');let token=input.value;input.value='';try{const res=await fetch('token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});document.getElementById('result').textContent=res.ok?'บันทึกแล้ว กลับไป preview ได้เลย':'บันทึกไม่สำเร็จ';}catch{document.getElementById('result').textContent='การเชื่อมต่อขาดหาย';}finally{token='';}};</script></html>
